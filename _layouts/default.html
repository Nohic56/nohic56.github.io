<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{ page.description | default: site.description }}">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>

  <!-- Fonts: Fraunces (display serif) + DM Sans (body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,600;1,9..144,300;1,9..144,400&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>

  <!-- ── Navigation ─────────────────────────────────────────────── -->
  <header class="site-header">
    <nav class="nav-inner">
      <a href="{{ '/' | relative_url }}" class="nav-logo">
        <span class="nav-logo-name">Nicolas Sénécaut</span>
        <span class="nav-logo-sub">PhD · Proteomics</span>
      </a>

      <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>

      <ul class="nav-links">
        <li><a href="{{ '/research' | relative_url }}" {% if page.url contains 'research' %}class="active"{% endif %}>Research</a></li>
        <li><a href="{{ '/publications' | relative_url }}" {% if page.url contains 'publications' %}class="active"{% endif %}>Publications</a></li>
        <li><a href="{{ '/projects' | relative_url }}" {% if page.url contains 'projects' %}class="active"{% endif %}>Projects</a></li>
        <li><a href="{{ '/methods' | relative_url }}" {% if page.url contains 'methods' %}class="active"{% endif %}>Methods</a></li>
        <li><a href="{{ '/cv' | relative_url }}" {% if page.url contains 'cv' %}class="active"{% endif %}>CV</a></li>
        <li><a href="{{ '/contact' | relative_url }}" class="nav-cta" {% if page.url contains 'contact' %}aria-current="page"{% endif %}>Contact</a></li>
      </ul>
    </nav>
  </header>

  <!-- ── Main ───────────────────────────────────────────────────── -->
  <main class="site-main">
    {{ content }}
  </main>

  <!-- ── Footer ─────────────────────────────────────────────────── -->
  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-left">
        <p class="footer-name">Nicolas Sénécaut, PhD</p>
        <p class="footer-affil">Postdoctoral Researcher · Kamenz Lab · University of Groningen</p>
      </div>
      <div class="footer-links">
        <a href="https://orcid.org/0000-0001-7948-6776" target="_blank" rel="noopener">ORCID</a>
        <a href="https://scholar.google.com/citations?user=MpVurAEAAAAJ" target="_blank" rel="noopener">Scholar</a>
        <a href="https://github.com/Nohic56" target="_blank" rel="noopener">GitHub</a>
        <a href="https://linkedin.com/in/nicolassenecaut" target="_blank" rel="noopener">LinkedIn</a>
      </div>
      <p class="footer-copy">&copy; {{ 'now' | date: "%Y" }} Nicolas Sénécaut</p>
    </div>
  </footer>

  <script src="{{ '/assets/js/nav.js' | relative_url }}"></script>
</body>
</html>
